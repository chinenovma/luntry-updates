{{- if and (.Values.redis.enabled) (.Values.redis.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "redis") .Values.redis.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-redis
    {{- include "common.labels" . | nindent 4 }}
{{- end }}