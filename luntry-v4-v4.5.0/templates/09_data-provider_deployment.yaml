{{- $app := .Values.dataProvider -}}
{{- if $app.enabled -}}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-data-provider
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-data-provider
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ $app.updateStrategy.type }}
    {{- if and (eq $app.updateStrategy.type "RollingUpdate") $app.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $app.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-data-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-data-provider
        {{- include "common.labels" . | nindent 8 }}
      {{- if or .Values.monitoring.prometheusOperatorAnnotations.enabled $app.annotations .Values.databaseConnectionConfiguration.postgres.bankVaultsInjector.enabled .Values.databaseConnectionConfiguration.clickhouse.bankVaultsInjector.enabled }}
      annotations:
        checksum/luntry-config: '{{ include (print $.Template.BasePath "/03_config.yaml") . | sha256sum }}'
        {{- if .Values.monitoring.prometheusOperatorAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: internals/metrics
        {{- end }}
        {{- if or .Values.databaseConnectionConfiguration.postgres.bankVaultsInjector.enabled .Values.databaseConnectionConfiguration.clickhouse.bankVaultsInjector.enabled }}
        {{- toYaml .Values.databaseConnectionConfiguration.bankVaultsInjectorAnnotations | nindent 8 }}
        {{- end }}
        {{- if $app.annotations }}
        {{- toYaml $app.annotations | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with $app.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "data-provider") $app.serviceAccount.name) }}
      {{- end }}
      {{- include "imagePullSecrets" . | nindent 6 }}
      containers:
        - name: data-provider
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ $app.image.name }}:{{ $app.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 12 }}
          {{- if ne $app.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 12 }}
          {{- else if ne .Values.globalResourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.globalResourcesPreset) | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /internals/healthcheck
              port: 8080
            failureThreshold: 24
            periodSeconds: 5
          env:
            {{- range $app.additionalEnvs }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- include "postgres.hostPortDbSsl" . | nindent 12 }}
            {{- include "postgres.envs" . | nindent 12 }}
            {{- include "clickhouse.HostDb" . | nindent 12 }}
            - name: CLICKHOUSE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-luntry-config
                  key: CLICKHOUSE_HTTP_PORT
            {{- include "clickhouse.envs" . | nindent 12 }}
            - name: NETWORKER_NETWORK_POLICY_ADDR
              value: {{ include "linkerPolicyHost" . | quote }}
            - name: NETWORKER_LINKS_ADDR
              value: {{ include "linkerLinksHost" . | quote }}
            - name: CHECKER_ADDR
              value: {{ include "checkerAddress" . | quote }}
            - name: COMMANDER_ADDR
              value: {{ include "commanderAddress" . | quote }}
            - name: SBOM_SCANNER_ADDR
              value: {{ include "registryScannerAddress" . | quote }}
            - name: LAPI_ADDR
              value: {{ include "lapiAddress" . | quote }}
            - name: DB_ACQUIRE
              value: {{ $app.timeout.acquire | quote }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ $app.node.maxOldSpaceSize }}"
            - name: DB_LOG
              value: {{ $app.log.db.enabled | quote }}
            - name: USER_LOG
              value: {{ $app.log.user.enabled | quote }}
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-data-provider
                  key: ADMIN_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-data-provider
                  key: ADMIN_PASSWORD
            {{- if .Values.dataProvider.oidc.refreshKey }}
            - name: OIDC_REFRESH_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-data-provider-oidc
                  key: OIDC_REFRESH_ENC_KEY
            {{- end }}
            - name: JWT_REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-data-provider-jwt
                  key: JWT_REFRESH_TOKEN_SECRET
            - name: JWT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-data-provider-jwt
                  key: JWT_TOKEN_SECRET
            {{- if or $app.ca.crtBase64 $app.ca.secretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: "/opt/CA/{{ $app.ca.secretKey | default "ca.crt" }}"
            {{- end }}
          {{- if or .Values.databaseConnectionConfiguration.postgres.tls.enabled (or $app.ca.crtBase64 $app.ca.secretName)}}
          volumeMounts:
            {{- include "pg.tls.volumeMount" . | nindent 12 }}
            {{- include "dataProvider.ca.volumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.dbwait.enabled }}
      initContainers:
        - name: db-wait
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ .Values.dbwait.image.name }}:{{ .Values.dbwait.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ .Values.dbwait.image.pullPolicy }}
          resources:
            {{- toYaml .Values.dbwait.resources | nindent 12 }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" .Values.dbwait.securityContext "context" $) | nindent 12 }}
          env:
            {{- include "postgres.hostPortDbSsl" . | nindent 12 }}
            {{- include "postgres.envs" . | nindent 12 }}
            - name: OBSERVATION_STRATEGY
              value: {{ .Values.develop.dbwait.observationStrategy.db.type | quote }}
            - name: TABLES_RECV_METHOD
              value: {{ .Values.develop.dbwait.observationStrategy.db.tablesRecvMethod | quote }}
            - name: TABLES_LIST
              value: {{ .Values.develop.dbwait.observationStrategy.db.tableList | quote }}
            - name: BACKOFF_INTERVAL_SEC
              value: {{ .Values.develop.dbwait.backoffIntervalSec | quote }}
            - name: MAX_BACKOFFS
              value: {{ .Values.develop.dbwait.maxBackoffs | quote }}
            - name: DELAY_AFTER_ENDPOINT_AVAILABLE_SEC
              value: {{ .Values.develop.dbwait.delay | quote }}
          {{- if .Values.databaseConnectionConfiguration.postgres.tls.enabled }}
          volumeMounts:
            {{- include "pg.tls.volumeMount" . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- if or .Values.databaseConnectionConfiguration.postgres.tls.enabled (or $app.ca.crtBase64 $app.ca.secretName)}}
      volumes:
        {{- include "pg.tls.volume" . | nindent 8 }}
        {{- include "dataProvider.ca.volume" . | nindent 8 }}
      {{- end }}

{{- if and $app.enabled $app.pdb.enabled (.Capabilities.APIVersions.Has "policy/v1") }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-data-provider
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-data-provider
    {{- include "common.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $app.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-data-provider
      app.kubernetes.io/part-of: {{ .Chart.Name }}
{{- end }}
{{- end }}
{{- end }}