{{- $app := .Values.auditLogAnalyzer -}}
{{- if $app.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-audit-log-analyzer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-audit-log-analyzer
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ $app.replicas }}
  strategy:
    type: {{ $app.updateStrategy.type }}
    {{- if and (eq $app.updateStrategy.type "RollingUpdate") $app.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $app.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-audit-log-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-audit-log-analyzer
        {{- include "common.labels" . | nindent 8 }}
      annotations:
        checksum/luntry-config: '{{ include (print $.Template.BasePath "/03_config.yaml") . | sha256sum }}'
        checksum/encryption-secret: '{{ include (print $.Template.BasePath "/03_encryption_secret.yaml") . | sha256sum }}'
        checksum/exporter-tls: '{{ include (print $.Template.BasePath "/13_exporter_tls.yaml") . | sha256sum }}'
        checksum/audit-log-tls: '{{ include (print $.Template.BasePath "/23_audit_log_analyzer_tls.yaml") . | sha256sum }}'
        {{- if .Values.monitoring.prometheusOperatorAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: metrics
        {{- end }}
        {{- if $app.annotations }}
        {{- toYaml $app.annotations | nindent 8 }}
        {{- end }}
    spec:
      {{- with $app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $app.affinity }}
      affinity:
        {{- tpl (toYaml $app.affinity) . | nindent 8 }}
      {{- end }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "audit-log-analyzer") $app.serviceAccount.name) }}
      {{- end }}
      containers:
        - name: audit-log-analyzer
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ $app.image.name }}:{{ $app.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 12 }}
          {{- if ne $app.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 12 }}
          {{- else if ne .Values.globalResourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.globalResourcesPreset) | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- end }}
          ports:
            - name: probe-port
              containerPort: 8080
            - name: webhook
              containerPort: 8081
          readinessProbe:
            httpGet:
              port: probe-port
              path: /ready
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: probe-port
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            {{- range $app.additionalEnvs }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- include "logFormat.envs" . | nindent 12 }}
            - name: LOG_LEVEL
              value: {{ $app.log.logLevel | quote }}
            - name: PROM
              value: {{ (or $app.prometheus.enabled .Values.monitoring.enabled) | quote }}
            - name: PROF
              value: {{ $app.profiling.enabled | quote }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: WEBHOOK_HTTP_ADDR
              value: ":8081"
            - name: WEBHOOK_SSL_ENABLED
              value: {{ $app.tls.enabled | quote }}
            {{- if $app.tls.enabled }}
            - name: WEBHOOK_SSL_CERT_PATH
              value: /usr/share/ca-certificates/tls.crt
            - name: WEBHOOK_SSL_KEY_PATH
              value: /usr/share/ca-certificates/tls.key
            {{- end }}
            - name: WORKERS
              value: {{ .Values.develop.auditLogAnalyzer.workers | quote }}
            - name: WATCHER_ADDR
              value: {{ include "watcherEndpoint" . | quote }}
            - name: EXPORTER_SERVICE_ADDR
              value: {{ include "exporterHost" . | quote }}
            - name: EXPORTER_SSL_ENABLED
              value: {{ .Values.exporter.tls.enabled | quote }}
            {{- if .Values.exporter.tls.enabled }}
            - name: EXPORTER_SSL_CA_PATH
              value: "/usr/share/ca-certificates/exporter-ca.crt"
            {{- end }}
            - name: DRIVER
              value: {{ $app.driver | quote }}
            {{- if eq $app.driver "gateway" }}
            - name: GATEWAY_SERVICE_ADDR
              value: {{ include "gatewayEndpoint" . | quote }}
            - name: GATEWAY_SSL_ENABLED
              value: {{ .Values.gateway.tls.enabled | quote }}
            {{- if .Values.gateway.tls.enabled }}
            - name: GATEWAY_SSL_CA_PATH
              value: "/usr/share/ca-certificates/gateway-ca.crt"
            {{- end }}
            {{- else if eq $app.driver "db" }}
              {{- include "postgres.hostPortDbSsl" . | nindent 12 }}
              {{- include "postgres.envs" . | nindent 12 }}
            {{- end }}
          {{- if or $app.tls.enabled .Values.exporter.tls.enabled .Values.gateway.tls.enabled (and (eq $app.driver "db") .Values.databaseConnectionConfiguration.postgres.tls.enabled) }}
          volumeMounts:
            {{- if $app.tls.enabled }}
            - name: audit-log-analyzer-tls
              mountPath: /usr/share/ca-certificates/tls.crt
              subPath: tls-crt
            - name: audit-log-analyzer-tls
              mountPath: /usr/share/ca-certificates/tls.key
              subPath: tls-key
            {{- end }}
            {{- include "exporter.tls.volumeMount" . | nindent 12 }}
            {{- if and (eq $app.driver "gateway") .Values.gateway.tls.enabled }}
            {{- include "gateway.tls.volumeMount" . | nindent 12 }}
            {{- end }}
            {{- if and (eq $app.driver "db") .Values.databaseConnectionConfiguration.postgres.tls.enabled }}
            {{- include "pg.tls.volumeMount" . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if .Values.dbwait.enabled }}
      initContainers:
        - name: db-wait
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ .Values.dbwait.image.name }}:{{ .Values.dbwait.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ .Values.dbwait.image.pullPolicy }}
          resources:
            {{- toYaml .Values.dbwait.resources | nindent 12 }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" .Values.dbwait.securityContext "context" $) | nindent 12 }}
          env:
            - name: OBSERVATION_STRATEGY
              value: "awaitEndpoint"
            - name: AWAIT_ENDPOINT
              value: {{ include "watcherAwaitEndpoint" . | quote }}
            - name: BACKOFF_INTERVAL_SEC
              value: {{ .Values.develop.dbwait.backoffIntervalSec | quote }}
            - name: MAX_BACKOFFS
              value: {{ .Values.develop.dbwait.maxBackoffs | quote }}
            - name: SSL_ENABLED
              value: {{ .Values.cmdDispatcher.tls.enabled | quote }}
      {{- end }}
      {{- if or $app.tls.enabled .Values.exporter.tls.enabled .Values.gateway.tls.enabled .Values.databaseConnectionConfiguration.postgres.tls.enabled }}
      volumes:
        {{- if $app.tls.enabled }}
        - name: audit-log-analyzer-tls
          secret:
            secretName: {{ $app.tls.crt.secretName | default (printf "%s-%s" .Release.Name "audit-log-analyzer-crt-key") }}
            items:
              - key: tls.crt
                path: tls-crt
              - key: tls.key
                path: tls-key
        {{- end }}
        {{- include "exporter.tls.volume" . | nindent 8 }}
        {{- if and (eq $app.driver "gateway") .Values.gateway.tls.enabled }}
        {{- include "gateway.tls.volume" . | nindent 8 }}
        {{- end }}
        {{- if and (eq $app.driver "db") .Values.databaseConnectionConfiguration.postgres.tls.enabled }}
        {{- include "pg.tls.volume" . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- include "imagePullSecrets" . | nindent 6 }}
{{- end }}