{{- if .Values.openShift.compatibility.customPrivilegedScc }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: "{{ .Release.Name }}-privileged"
  annotations:
    kubernetes.io/description: '{{ .Release.Name }}-privileged allows access to all privileged and host
      features and the ability to run as any user, any group, any fsGroup, and with
      any SELinux context. This SCC used by Luntry system in {{ .Release.Namespace }} project'
  labels:
    {{- include "common.labels" . | nindent 4 }}
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: true
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
- '*'
allowedUnsafeSysctls:
- '*'
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities: null
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
seccompProfiles:
- '*'
supplementalGroups:
  type: RunAsAny
users:
- 'system:serviceaccount:{{ .Release.Namespace }}:{{ default (printf "%s-%s" .Release.Name "sensor") .Values.sensor.serviceAccount.name }}'
- 'system:serviceaccount:{{ .Release.Namespace }}:{{ default (printf "%s-%s" .Release.Name "compliance") .Values.complianceOperator.serviceAccount.name }}'
volumes:
- '*'
{{- end }}