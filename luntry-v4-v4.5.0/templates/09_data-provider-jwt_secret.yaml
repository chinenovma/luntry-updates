{{- $secret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-%s" .Release.Name "data-provider-jwt")) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-data-provider-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "data-provider"
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{- if $secret }}
  JWT_REFRESH_TOKEN_SECRET: {{ $secret.data.JWT_REFRESH_TOKEN_SECRET }}
  JWT_TOKEN_SECRET: {{ $secret.data.JWT_TOKEN_SECRET }}
  {{- else }}
  JWT_REFRESH_TOKEN_SECRET: {{ (randAlphaNum 32 | b64enc) | quote }}
  JWT_TOKEN_SECRET: {{ (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}