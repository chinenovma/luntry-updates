{{- if and .Values.visualizer.enabled (not .Values.visualizer.tls.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-visualizer-crt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-visualizer
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  {{- if and .Values.visualizer.tls.crtBase64 .Values.visualizer.tls.keyBase64 }}
    tls.crt: {{ .Values.visualizer.tls.crtBase64 }}
    tls.key: {{ .Values.visualizer.tls.keyBase64 }}
  {{- else }}
  {{- $secret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-%s" .Release.Name "visualizer-crt-key")) -}}
  {{- if $secret }}
    tls.crt: {{ index $secret.data "tls.crt" }}
    tls.key: {{ index $secret.data "tls.key" }}
    ca.crt: {{ index $secret.data "ca.crt" }}
  {{- else }}
  {{- $ca := genCA "snakeoil" 365 -}}
  {{- $cert := genSignedCert .Values.visualizer.tls.domainName nil nil 365 $ca }}
    tls.crt: {{ $cert.Cert | b64enc }}
    tls.key: {{ $cert.Key | b64enc }}
    ca.crt: {{ $ca.Cert | b64enc }}
  {{- end }}
  {{- end }}
type: kubernetes.io/tls
{{- end }}
