{{- if .Values.auditLogAnalyzer.enabled }}
{{- if (and .Values.auditLogAnalyzer.tls.enabled .Values.auditLogAnalyzer.tls.crt.crtBase64 .Values.auditLogAnalyzer.tls.crt.keyBase64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-audit-log-analyzer-crt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-audit-log-analyzer
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  tls.crt: {{ .Values.auditLogAnalyzer.tls.crt.crtBase64 }}
  tls.key: {{ .Values.auditLogAnalyzer.tls.crt.keyBase64 }}
type: kubernetes.io/tls
{{- end }}
{{- end }}