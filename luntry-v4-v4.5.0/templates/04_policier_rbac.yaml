{{- if and (.Values.policier.enabled) (.Values.policier.serviceAccount.create) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "policier") .Values.policier.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-policier
    {{- include "common.labels" . | nindent 4 }}
{{- end }}