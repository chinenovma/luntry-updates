{{- if and .Values.databaseConnectionConfiguration.kafka.ssl.enabled .Values.databaseConnectionConfiguration.kafka.ssl.ca.crtBase64 -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-kafka-ssl-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-kafka
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.databaseConnectionConfiguration.kafka.ssl.ca.crtBase64 }}
{{- end }}