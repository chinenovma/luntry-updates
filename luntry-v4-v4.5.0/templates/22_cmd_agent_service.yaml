{{- if .Values.cmdAgent.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cmd-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-agent
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.cmdAgent.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.cmdAgent.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-agent
  ports:
    - name: http
      protocol: TCP
      port: 8080
{{- end }}