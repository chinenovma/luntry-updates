---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-data-provider
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "data-provider"
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_USER: {{ .Values.admin.user | default "luntry" | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | default "luntry_pass" | quote }}
