{{- if .Values.cmdDispatcher.enabled }}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cmd-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-dispatcher
    {{- include "common.labels" . | nindent 4 }}
    {{- with .Values.cmdDispatcher.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.cmdDispatcher.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.cmdDispatcher.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-dispatcher
  type: {{ .Values.cmdDispatcher.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
    - name: grpc
      protocol: TCP
      port: 3338
      {{- if and (eq .Values.cmdDispatcher.service.type "NodePort") (.Values.cmdDispatcher.service.nodePort)}}
      nodePort: {{ .Values.cmdDispatcher.service.nodePort }}
      {{- end }}
      {{- if .Values.cmdDispatcher.service.appProtocol }}
      appProtocol: {{ .Values.cmdDispatcher.service.appProtocol }}
      {{- end }}
{{- end }}
{{- end }}