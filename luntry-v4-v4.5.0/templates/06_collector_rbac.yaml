{{- if and (.Values.collector.enabled) (.Values.collector.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "collector") .Values.collector.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-collector
    {{- include "common.labels" . | nindent 4 }}
{{- end }}