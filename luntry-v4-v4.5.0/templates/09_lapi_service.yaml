{{- if and (.Values.lapi.enabled) (or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main"))) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lapi
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-lapi
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.lapi.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.lapi.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Release.Name }}-lapi
  ports:
    - name: grpc
      protocol: TCP
      port: 43100
    - name: http
      protocol: TCP
      port: 8080
{{- end }}