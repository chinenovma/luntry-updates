{{- $app := .Values.visualizer -}}
{{- if $app.enabled -}}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-visualizer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-visualizer
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ $app.updateStrategy.type }}
    {{- if and (eq $app.updateStrategy.type "RollingUpdate") $app.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $app.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-visualizer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-visualizer
        {{- include "common.labels" . | nindent 8 }}
      {{- if $app.annotations }}
      annotations:
        {{- if $app.annotations }}
        {{- toYaml $app.annotations | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with $app.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "visualizer") $app.serviceAccount.name) }}
      {{- end }}
      containers:
        - name: visualizer
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ $app.image.name }}:{{ $app.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 12 }}
          {{- if ne $app.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 12 }}
          {{- else if ne .Values.globalResourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.globalResourcesPreset) | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          env:
            {{- range $app.additionalEnvs }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            - name: PROXY_TO_DATAPROVIDER_ADDR
              value: {{ printf "%s%s" "http://" (include "dataProviderEndpoint" .) | quote }}
            - name: PROXY_TIMEOUT
              value: {{ $app.timeoutConfig.proxyTimeout | quote }}
            - name: TLS_CERT_PATH
              value: /opt/tls.crt
            - name: TLS_KEY_PATH
              value: /opt/tls.key
          volumeMounts:
            - name: tls-secret
              mountPath: /opt/tls.crt
              subPath: tls-crt
            - name: tls-secret
              mountPath: /opt/tls.key
              subPath: tls-key
      {{- if .Values.dbwait.enabled }}
      initContainers:
        - name: db-wait
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ .Values.dbwait.image.name }}:{{ .Values.dbwait.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ .Values.dbwait.image.pullPolicy }}
          resources:
            {{- toYaml .Values.dbwait.resources | nindent 12 }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" .Values.dbwait.securityContext "context" $) | nindent 12 }}
          env:
            - name: OBSERVATION_STRATEGY
              value: {{ .Values.develop.dbwait.observationStrategy.dataProvider.type | quote }}
            - name: AWAIT_ENDPOINT
              value: {{ printf "%s%s/%s" "http://" (include "dataProviderEndpoint" .) "internals/healthcheck" | quote }}
            - name: BACKOFF_INTERVAL_SEC
              value: {{ .Values.develop.dbwait.backoffIntervalSec | quote }}
            - name: MAX_BACKOFFS
              value: {{ .Values.develop.dbwait.maxBackoffs | quote }}
            - name: DELAY_AFTER_ENDPOINT_AVAILABLE_SEC
              value: {{ .Values.develop.dbwait.delay | quote }}
      {{- end }}
      {{- include "imagePullSecrets" . | nindent 6 }}
      volumes:
        - name: tls-secret
          secret:
            secretName: {{ $app.tls.secretName | default (printf "%s-%s" .Release.Name "visualizer-crt-key") }}
            items:
              - key: tls.crt
                path: tls-crt
              - key: tls.key
                path: tls-key

{{- if and $app.enabled $app.pdb.enabled (.Capabilities.APIVersions.Has "policy/v1") }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-visualizer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-visualizer
    {{- include "common.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $app.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-visualizer
      app.kubernetes.io/part-of: {{ .Chart.Name }}
{{- end }}
{{- end }}
{{- end }}