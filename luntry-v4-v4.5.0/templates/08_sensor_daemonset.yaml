{{- $app := .Values.sensor -}}
{{- if $app.enabled -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-sensor-rs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-sensor-rs
    {{- include "common.labels" . | nindent 4 }}
    luntry.com/sensor-version: "rust"
spec:
  updateStrategy:
    type: {{ $app.updateStrategy.type }}
    {{- if and (eq $app.updateStrategy.type "RollingUpdate") $app.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $app.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-sensor-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-sensor-rs
        {{- include "common.labels" . | nindent 8 }}
      annotations:
        checksum/auth-sensor: '{{ include (print $.Template.BasePath "/08_sensor_auth.yaml") . | sha256sum }}'
        {{- if .Values.monitoring.prometheusOperatorAnnotations.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: metrics
        {{- end }}
        {{- if $app.annotations }}
        {{- toYaml $app.annotations | nindent 8 }}
        {{- end }}
    spec:
      {{- if $app.reactions.enabled }}
      hostIPC: true
      hostPID: true
      {{- end }}
      {{- with $app.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "sensor") $app.serviceAccount.name) }}
      {{- end }}
      containers:
        - name: sensor
          args:
            - sensor
            {{- if $app.log.verbose }}
            - -v
            {{- end }}
            {{- if $app.readinessCheck.enabled }}
            - --readiness
            {{- end }}
          image: "{{ $app.image.registry | default .Values.imageCredentials.registry }}/{{ $app.image.repository | default .Values.imageCredentials.repository }}/{{ $app.image.name }}:{{ $app.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probe-port
              containerPort: 80
          {{- if $app.readinessCheck.enabled }}
          readinessProbe:
            httpGet:
              port: probe-port
              path: /readyz
            initialDelaySeconds: 60
            periodSeconds: 30
          {{- end }}
          {{- if ne $app.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 12 }}
          {{- else if ne .Values.globalResourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.globalResourcesPreset) | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 12 }}
          env:
            {{- range $app.additionalEnvs }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            - name: COLLECTOR
              value: {{ include "collectorEndpoint" . | quote }}
            - name: SENSOR_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BTF_ON
              value: {{ $app.btf.enabled | ternary "1" "0" | quote }}
            - name: USE_BTF_MAPS
              value: {{ $app.btf.useBtfMaps | ternary "1" "0" | quote }}
            - name: EVENTC_DISABLE_FILES
              value: {{ $app.modulesDisabled.files | quote }}
            - name: EVENTC_DISABLE_NETWORK
              value: {{ $app.modulesDisabled.network | quote }}
            - name: RUST_LOG
              value: {{ $app.log.logLevel | quote }}
            - name: BPF_LOAD_DEBUG
              value: {{ $app.log.bpfDebug | ternary "1" "0" | quote }}
            - name: PROM_ENABLE
              value: {{ (or $app.prometheus.enabled .Values.monitoring.enabled) | ternary "1" "0" | quote }}
            - name: PROM_ADDRESS
              value: {{ $app.prometheus.address | quote }}
            - name: UNSTABLE_MONOTONIC
              value: {{ $app.unstableMonotonic.enabled | ternary "1" "0" | quote }}
            - name: RECONNECT_TIMEOUT
              value: {{ $app.balancing.reconnectTimeout | quote }}
            - name: RECONNECT_PERC_DELTA
              value: {{ $app.balancing.reconnectPercDelta | quote }}
            - name: DROP_OVERFLOWING_EVENTS
              value: {{ $app.dropOverflowEvents.enabled | quote }}
            - name: DROP_EVENTS_BEFORE_CONVERGENCE
              value: {{ $app.dropEventsBeforeConvergence.enabled | quote }}
            - name: SEND_NON_CONTAINER_EVENTS
              value: {{ $app.sendNonContainerEvents.enabled | quote }}
            {{- if $app.dataDir }}
            - name: DATA_DIR
              value: "/logs"
            {{- end }}
            - name: LUNTRY_HOST_ROOT
              value: {{ $app.hostRoot | quote }}
            - name: DISABLE_RUN_HEALTH_CHECK
              value: {{ .Values.develop.sensor.healthCheck.disabled | ternary "1" "0" | quote }}
            - name: HEALTH_CHECK_PERIOD
              value: {{ .Values.develop.sensor.healthCheck.period | quote }}
            {{- if .Values.develop.sensor.criRuntimeEndpoint }}
            - name: LUNTRY_CRI_RUNTIME_ENDPOINT
              value: {{ .Values.develop.sensor.criRuntimeEndpoint | quote }}
            {{- end }}
            {{- if .Values.develop.sensor.dockerSocket }}
            - name: LUNTRY_DOCKER_SOCKET
              value: {{ .Values.develop.sensor.dockerSocket | quote }}
            {{- end }}
            {{- if .Values.develop.sensor.kernelDir }}
            - name: KERNELDIR
              value: {{ .Values.develop.sensor.kernelDir | quote }}
            {{- end }}
            {{- if .Values.develop.sensor.kernelSearchBase }}
            - name: KERNEL_SEARCH_BASE
              value: {{ .Values.develop.sensor.kernelSearchBase | quote }}
            {{- end }}
            {{- if .Values.develop.sensor.stub }}
            - name: STUB
              value: {{ .Values.develop.sensor.stub | quote }}
            {{- end }}
            - name: RPC_QUEUE_CAPACITY
              value: {{ $app.rpcQueueCapacity | quote }}
            - name: ARGS_TOTAL_LENGTH_LIMIT
              value: {{ $app.argsLengthLimit | quote }}
            {{- if and $app.reactions.enabled $app.reactions.remote.ftp.host }}
            - name: REMOTE_FTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_FTP_USERNAME
            - name: REMOTE_FTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_FTP_PASSWORD
            - name: REMOTE_FTP_IPADDR_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_FTP_IPADDR_PORT
            {{- end }}
            {{- if and $app.reactions.enabled $app.reactions.remote.smb.host }}
            - name: REMOTE_SMB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_SMB_USERNAME
            - name: REMOTE_SMB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_SMB_PASSWORD
            - name: REMOTE_SMB_IPADDR_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_SMB_IPADDR_PORT
            {{- end }}
            {{- if and $app.reactions.enabled $app.reactions.remote.s3.host }}
            - name: REMOTE_S3_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_S3_USERNAME
            - name: REMOTE_S3_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_S3_PASSWORD
            - name: REMOTE_S3_IPADDR_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-sensor-auth
                  key: REMOTE_S3_IPADDR_PORT
            {{- end }}
            - name: IGNORE_UNREADY_THREADS
              value: {{ .Values.develop.sensor.ignoreUnreadyThreads | ternary "1" "0" | quote }}
            - name: ALLOW_UNCONVERGED_THREADS
              value: {{ .Values.develop.sensor.allowUnconvergedThreads | ternary "1" "0" | quote }}
            - name: DISABLE_WAKERS
              value: {{ .Values.develop.sensor.disableWakers | ternary "1" "0" | quote }}
            - name: FORCE_LINUX_VERSION_CODE
              value: {{ .Values.develop.sensor.forceLinuxVersionCode | ternary "1" "0" | quote }}
            - name: DISABLE_KALLSYMS_ALL
              value: {{ .Values.sensor.btf.disableKallsymsAll | ternary "1" "0" | quote }}
          volumeMounts:
            - mountPath: /host/proc
              readOnly: true
              name: host-proc
            - mountPath: /host/boot
              readOnly: true
              name: host-boot
            - mountPath: /host/etc
              readOnly: true
              name: host-etc
            - mountPath: /host/lib/modules
              readOnly: true
              name: host-libmodules
            - mountPath: /host/usr
              readOnly: true
              name: host-usr
            - mountPath: /host/var/lib
              readOnly: true
              name: host-var-lib
            - mountPath: /host/var/run
              name: host-varrun
            - mountPath: /host/run
              name: host-run
            - mountPath: /logs
              name: host-logsdir
            - mountPath: /tmp
              name: tmp
            {{- if $app.reactions.remote.rsync.containerDir }}
            - mountPath: {{ $app.reactions.remote.rsync.containerDir }}
              name: host-reactions-rsync
            {{- end }}
        {{- if $app.ciliumAdapter.enabled }}
        - name: cilium-adapter
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ $app.ciliumAdapter.image.name }}:{{ $app.ciliumAdapter.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          {{- if ne $app.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $app.ciliumAdapter.resourcesPreset) | nindent 12 }}
          {{- else if ne .Values.globalResourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.globalResourcesPreset) | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $app.ciliumAdapter.resources | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.ciliumAdapter.securityContext "context" $) | nindent 12 }}
          ports:
            - name: metrics-port
              containerPort: 8081
          readinessProbe:
            httpGet:
              port: metrics-port
              path: /ready
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: metrics-port
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: COLLECTOR_SERVICE_ADDR
              value: {{ include "collectorEndpoint" . | quote }}
            - name: LOG_LEVEL
              value: {{ $app.ciliumAdapter.log.logLevel | quote }}
            - name: PROM
              value: {{ (or $app.ciliumAdapter.prometheus.enabled .Values.monitoring.enabled) | quote }}
            - name: PROF
              value: {{ $app.ciliumAdapter.profiling.enabled | quote }}
            - name: CILIUM_SOCKET
              value: "/var/run/cilium/cilium.sock"
          volumeMounts:
            - mountPath: /var/run/cilium
              name: host-cilium-socket
        {{- end }}
      initContainers:
        {{- if $app.wait.collector.enabled }}
        - name: collector-wait
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ .Values.dbwait.image.name }}:{{ .Values.dbwait.image.tag  | default .Values.allTag }}"
          imagePullPolicy: {{ .Values.dbwait.image.pullPolicy }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" .Values.dbwait.securityContext "context" $) | nindent 12 }}
          resources:
            {{- toYaml .Values.dbwait.resources | nindent 12 }}
          env:
            - name: OBSERVATION_STRATEGY
              value: {{ .Values.develop.dbwait.observationStrategy.collector.type | quote }}
            - name: BACKOFF_INTERVAL_SEC
              value: {{ $app.wait.backoffIntervalSec | quote }}
            - name: MAX_BACKOFFS
              value: {{ $app.wait.maxBackoffs | quote }}
            - name: AWAIT_ENDPOINT
              value: {{ printf "%s%s" "grpc://" (include "collectorEndpoint" .) | quote }}
            - name: DELAY_AFTER_ENDPOINT_AVAILABLE_SEC
              value: {{ $app.wait.delayAfterEndpointAvailable | quote }}
        {{- end }}
        {{- if $app.log.cleanup }}
        - name: logs-cleanup
          image: "{{ .Values.imageCredentials.registry }}/{{ .Values.imageCredentials.repository }}/{{ $app.image.name }}:{{ $app.image.tag  | default .Values.allTag }}"
          command:
            - sh
            - -c
            - |
              ls -1t /logs/*.zst | tail -n +4 | xargs -r rm -f
          imagePullPolicy: {{ $app.image.pullPolicy }}
          securityContext:
            {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 12 }}
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 10Mi
          volumeMounts:
            - mountPath: /logs/
              name: host-logsdir
        {{- end }}
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-boot
          hostPath:
            path: /boot
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-libmodules
          hostPath:
            path: /lib/modules
        - name: host-usr
          hostPath:
            path: /usr
        - name: host-varrun
          hostPath:
            path: /var/run
        - name: host-run
          hostPath:
            path: /run
        - name: host-var-lib
          hostPath:
            path: /var/lib
        - name: host-logsdir
          hostPath:
            path: {{ $app.dataDir }}
            type: DirectoryOrCreate
        - name: host-cilium-socket
          hostPath:
            path: {{ $app.ciliumAdapter.socketPath | quote }}
        {{- if $app.reactions.remote.rsync.hostDir }}
        - name: host-reactions-rsync
          {{- if eq ($app.reactions.remote.rsync.pvc.type | lower) "hostpath" }}
          hostPath:
            path: {{ $app.reactions.remote.rsync.hostDir }}
            type: DirectoryOrCreate
          {{- else if eq ($app.reactions.remote.rsync.pvc.type | lower) "emptydir" }}
          emptyDir:
            sizeLimit: {{ $app.reactions.remote.rsync.pvc.size | quote }}
          {{- else if eq ($app.reactions.remote.rsync.pvc.type | lower) "genericephemeralvolume" }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: {{ $app.reactions.remote.rsync.pvc.storageClass }}
                resources:
                  requests:
                    storage: {{ $app.reactions.remote.rsync.pvc.size | quote }}
          {{- else if eq ($app.reactions.remote.rsync.pvc.type | lower) "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sensor-rsync
          {{- else }}
          {{- fail "incorrect volume type in sensor.reactions.remote.rsync.type" }}
          {{- end }}
        {{- end }}
        - name: tmp
          {{- if eq ($app.pvc.type | lower) "emptydir"}}
          emptyDir:
            sizeLimit: {{ $app.pvc.size | quote }}
          {{- else if eq ($app.pvc.type | lower) "genericephemeralvolume" }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: {{ $app.pvc.storageClass }}
                resources:
                  requests:
                    storage: {{ $app.pvc.size | quote }}
          {{- else }}
          {{- fail "incorrect volume type in sensor.pvc.type" }}
          {{- end }}
      {{- include "imagePullSecrets" . | nindent 6 }}
{{- end }}
