{{- $secret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-%s" .Release.Name "encryption-secret")) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-encryption-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "encryption-secret"
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $secret }}
  ENCRYPTION_STRING: {{ $secret.data.ENCRYPTION_STRING }}
{{- else }}
  ENCRYPTION_STRING: {{ (default (randAlphaNum 64) .Values.develop.encryption_string) | b64enc | quote }}
{{- end }}