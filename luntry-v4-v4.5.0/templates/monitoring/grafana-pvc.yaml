{{- if and (.Values.monitoring.enabled) (.Values.monitoring.grafana.enabled) (eq .Values.monitoring.grafana.pvc.type "pvc") -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-grafana
    {{- include "common.labels" . | nindent 4 }}
spec:
{{- if or .Values.monitoring.grafana.pvc.storageClass .Values.monitoring.grafana.pv.enabled }}
{{- if .Values.monitoring.grafana.pvc.storageClass }}
  storageClassName: {{ .Values.monitoring.grafana.pvc.storageClass | quote }}
{{- else if and .Values.monitoring.grafana.pv.enabled  (not .Values.monitoring.grafana.pv.storageClass.create) .Values.monitoring.grafana.pv.storageClass.name }}
  storageClassName: {{ .Values.monitoring.grafana.pv.storageClass.name | quote }}
{{- else if and .Values.monitoring.grafana.pv.enabled  .Values.monitoring.grafana.pv.storageClass.create (not .Values.monitoring.grafana.pv.storageClass.name) }}
  storageClassName: "{{ .Release.Name }}-local-storage"
  volumeName: {{ .Release.Name }}-grafana
{{- end }}
{{- end }}
  accessModes:
    - {{ .Values.monitoring.grafana.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.pvc.size }}
{{- end -}}