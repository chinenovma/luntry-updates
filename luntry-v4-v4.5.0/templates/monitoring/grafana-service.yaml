{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: {{ .Chart.Name }}
  {{- if .Values.monitoring.grafana.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.monitoring.grafana.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-grafana
    app.kubernetes.io/part-of: {{ .Chart.Name }}
  type: {{ .Values.monitoring.grafana.service.type }}
  ports:
  - name: http-grafana
    protocol: TCP
    port: 3000
{{- end -}}