{{- $app := .Values.clickhouse -}}
{{- if $app.enabled -}}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-clickhouse
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ $app.updateStrategy.type }}
    {{- if and (eq $app.updateStrategy.type "RollingUpdate") $app.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml $app.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-clickhouse
        {{- include "common.labels" . | nindent 8 }}
      annotations:
        checksum/auth-clickhouse: '{{ include (print $.Template.BasePath "/clickhouse/clickhouse_auth.yaml") . | sha256sum }}'
        checksum/configmap-clickhouse: '{{ include (print $.Template.BasePath "/clickhouse/clickhouse_configmap.yaml") . | sha256sum }}'
        {{- if and .Values.monitoring.prometheusOperatorAnnotations.enabled (or $app.prometheus.enabled .Values.monitoring.enabled ) }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: metrics
        {{- end }}
        {{- if $app.annotations }}
        {{- toYaml $app.annotations | nindent 8 }}
        {{- end }}
    spec:
      {{- with $app.nodeSelector}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "renderSecurityContext" (dict "secContext" $app.podSecurityContext "context" $) | nindent 8 }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "clickhouse") $app.serviceAccount.name) }}
      {{- end }}
      containers:
      - name: clickhouse
        imagePullPolicy: {{ $app.image.pullPolicy | quote }}
        image: "{{ $app.image.registry | default .Values.imageCredentials.registry }}/{{ $app.image.name }}:{{ $app.image.tag }}"
        {{- if .Values.openShift.compatibility.clickhouseInitFix }}
        command:
          - /bin/bash
          - -c
          - sed 's/id -g/id -gn/' /entrypoint.sh > /tmp/entrypoint.sh; exec bash /tmp/entrypoint.sh
        {{- end }}
        ports:
          - name: http
            containerPort: 8123
          - name: tcp
            containerPort: 9000
          - name: metrics
            containerPort: 8080
        securityContext:
          {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 10 }}
        {{- if eq $app.resourcesPreset "none" }}
        resources:
          {{- toYaml $app.resources | nindent 10 }}
        {{- else }}
        resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 10 }}
        {{- end }}
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 100
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 30
          httpGet:
            path: /ping
            port: http
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 30
          httpGet:
            path: /ping
            port: http
        env:
          {{- range $app.additionalEnvs }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
          {{- include "clickhouse.envs" . | nindent 10 }}
          - name: CLICKHOUSE_HTTP_PORT
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-luntry-config
                key: CLICKHOUSE_HTTP_PORT
          - name: CLICKHOUSE_TCP_PORT
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-luntry-config
                key: CLICKHOUSE_TCP_PORT
          - name: CLICKHOUSE_DB
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-luntry-config
                key: CLICKHOUSE_DB
          - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
            value: "1"
          - name: CLICKHOUSE_SHARD_ID
            value: {{ .Values.develop.clickhouse.shardId | quote }}
          - name: CLICKHOUSE_REPLICA_ID
            value: {{ .Values.develop.clickhouse.replicaId | quote }}
        volumeMounts:
          - name: data
            mountPath: /var/lib/clickhouse
          - name: clickhouse-config
            mountPath: /etc/clickhouse-server/config.d/
      volumes:
        - name: data
          {{- if eq ($app.pvc.type | lower) "emptydir" }}
          emptyDir:
            sizeLimit: {{ $app.pvc.size | quote }}
          {{- else if eq ($app.pvc.type | lower) "genericephemeralvolume" }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - {{ $app.pvc.accessMode }}
                storageClassName: {{ $app.pvc.storageClass }}
                resources:
                  requests:
                    storage: {{ $app.pvc.size | quote }}
          {{- else if eq ($app.pvc.type | lower) "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-clickhouse
          {{- else }}
          {{- fail "incorrect volume type in clickhouse.pvc.type" }}
          {{- end }}
        - name: clickhouse-config
          configMap:
            name: {{ .Release.Name }}-clickhouse-config
      {{- include "imagePullSecrets" . | nindent 6 }}
{{- end }}
{{- end }}