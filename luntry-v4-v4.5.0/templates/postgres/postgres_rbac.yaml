{{- if and (.Values.postgres.enabled) (.Values.postgres.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "postgres") .Values.postgres.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-postgres
    {{- include "common.labels" . | nindent 4 }}
{{- end }}