{{- if (and .Values.gateway.tls.enabled .Values.gateway.tls.ca.crtBase64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gateway-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-gateway
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.gateway.tls.ca.crtBase64 }}
{{- end }}

{{- if .Values.gateway.enabled }}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) }}
{{- if (and .Values.gateway.tls.enabled .Values.gateway.tls.crt.crtBase64 .Values.gateway.tls.crt.keyBase64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gateway-crt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-gateway
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  tls.crt: {{ .Values.gateway.tls.crt.crtBase64 }}
  tls.key: {{ .Values.gateway.tls.crt.keyBase64 }}
type: kubernetes.io/tls
{{- end }}
{{- end }}
{{- end }}