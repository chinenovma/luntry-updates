# yaml-language-server: $schema=values.schema.json

imageCredentials:
  # -- (bool) Создание imagePullSecret
  # @section -- imagePullSecret
  create: true
  # -- (string) Название секрета
  # @section -- imagePullSecret
  secretName: ""
  # -- (string) Доменное имя или адрес локального registry
  # @section -- imagePullSecret
  registry: registry.luntry.com
  # -- (string) Имя репозитория или проекта в registry
  # @section -- imagePullSecret
  repository: luntry
  # -- (string) Имя пользователя для доступа к registry
  # @section -- imagePullSecret
  username: ""
  # -- (string) Пароль пользователя
  # @section -- imagePullSecret
  password: ""
  # @schema
  # format: idn-email
  # @schema
  # -- (string) Email
  # @section -- imagePullSecret
  email: robot@luntry.com

# -- (string) Глобальный тэг для образов, используется если не задан "service.image.tag"
allTag: v4.5

# @schema
# examples: ["none", "nano", "micro", "small", "medium", "large", "xlarge", "2xlarge"]
# @schema
# -- (string) Глобальный пресет ресурсов
globalResourcesPreset: none

# -- (string) Лицензия в формате Base64, также можно добавить позже в GUI
licenseKey: ""

openShift:
  compatibility:
    # -- (bool) Адаптирует SecurityContext ресурсов для Openshift (удаляет поля runAsUser, runAsGroup, fsGroup)
    # @section -- Openshift compatibility
    adaptSecurityContext: false
    # -- (bool) Изменяет init скрипт контейнера Clickhouse для работы с кастомным UID
    # @section -- Openshift compatibility
    clickhouseInitFix: false
    # -- (bool) Автоматически назначает SCC privileged для SA luntry-sensor
    # "sensor.serviceAccount.create" должен быть включен
    # @section -- Openshift compatibility
    sensorPrivilegedScc: false
    # -- (bool) Автоматически назначает SCC privileged для SA luntry-compliance
    # "complianceOperator.serviceAccount.create" должен быть включен
    # @section -- Openshift compatibility
    compliancePrivilegedScc: false
    # -- (bool) Использование CIS Openshift Benchmark
    # @section -- Openshift compatibility
    complianceCisBenchmark: false
    # -- (bool) Создает новый SCC с именем luntry-privileged и назначает его на SA luntry-sensor и luntry-compliance
    # @section -- Openshift compatibility
    customPrivilegedScc: false

databaseConnectionConfiguration:
  # @schema
  # additionalProperties: true
  # @schema
  # -- (object) Аннотации для добавления в Deployment сервисов, которые используют БД
  # @section -- databaseConnectionConfiguration
  bankVaultsInjectorAnnotations: {}
  clickhouse:
    # -- (string) Адрес сервера
    # @default -- "ReleaseName-clickhouse.ReleaseNamespace"
    # @section -- databaseConnectionConfiguration
    host: ""
    # -- (string) HTTP порт
    # @default -- 8123
    # @section -- databaseConnectionConfiguration
    portHTTP: ""
    # -- (string) TCP порт
    # @default -- 9000
    # @section -- databaseConnectionConfiguration
    portTCP: ""
    # -- (string) Имя БД
    # @default -- luntry
    # @section -- databaseConnectionConfiguration
    dbName: ""
    # -- (string) Имя пользователя БД
    # @default -- collector
    # @section -- databaseConnectionConfiguration
    username: ""
    # -- (string) Пароль пользователя БД
    # @default -- 123QWEasd
    # @section -- databaseConnectionConfiguration
    password: ""
    customSecret:
      # -- (string) Имя существующего секрета
      # @section -- databaseConnectionConfiguration
      secretName: ""
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
    bankVaultsInjector:
      # -- (bool) Включение использования [Bank-Vaults Secret injection webhook](https://bank-vaults.dev/docs/mutating-webhook/)
      # @section -- databaseConnectionConfiguration
      enabled: false
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
  kafka:
    # -- (string) Адрес сервера
    # @default -- "ReleaseName-kafka.ReleaseNamespace"
    # @section -- databaseConnectionConfiguration
    host: ""
    # -- (string) Порт
    # @default -- 9092
    # @section -- databaseConnectionConfiguration
    port: ""
    # -- (string) Имя пользователя БД
    # @default -- luntry
    # @section -- databaseConnectionConfiguration
    username: ""
    # -- (string) Пароль пользователя БД
    # @default -- 1A5nzldlz1psgwcG
    # @section -- databaseConnectionConfiguration
    password: ""
    # -- Механизм аутентификации SCRAM-SHA-256, SCRAM-SHA-512 или "" для PLAIN
    # @section -- databaseConnectionConfiguration
    authMechanism: ""
    ssl:
      # -- (bool) Включает использование SSL для подключения к БД
      # @section -- databaseConnectionConfiguration
      enabled: false
      # -- (bool) Пропускать верификацию SSL сертификата
      # @section -- databaseConnectionConfiguration
      skipVerify: false
      ca:
        # -- (string) СА цепочка в Base64 формате
        # @section -- databaseConnectionConfiguration
        crtBase64: ""
        # -- (string) Имя существующего секрета
        # @section -- databaseConnectionConfiguration
        secretName: ""
        # -- (string) Ключ содержащий сертификат
        # @section -- databaseConnectionConfiguration
        secretKey: ""
    customSecret:
      # -- (string) Имя существующего секрета
      # @section -- databaseConnectionConfiguration
      secretName: ""
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: "KAFKA_CLIENT_USER"
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: "KAFKA_CLIENT_PASSWORD"
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      interBrokerUserKey: "KAFKA_INTER_BROKER_USER"
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      interBrokerPasswordKey: "KAFKA_INTER_BROKER_PASSWORD"
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      controllerUserKey: "KAFKA_CONTROLLER_USER"
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      controllerPasswordKey: "KAFKA_CONTROLLER_PASSWORD"
    bankVaultsInjector:
      # -- (bool) Включение использования [Bank-Vaults Secret injection webhook](https://bank-vaults.dev/docs/mutating-webhook/)
      # @section -- databaseConnectionConfiguration
      enabled: false
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      interBrokerUserKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      interBrokerPasswordKey: ""
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      controllerUserKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      controllerPasswordKey: ""
  postgres:
    # -- (string) Адрес сервера
    # @default -- "ReleaseName-postgres.ReleaseNamespace"
    # @section -- databaseConnectionConfiguration
    host: ""
    # -- (string) Порт
    # @default -- 5432
    # @section -- databaseConnectionConfiguration
    port: ""
    # -- (string) Имя БД
    # @section -- databaseConnectionConfiguration
    dbName: collector
    # -- (string) Имя схемы БД
    # @section -- databaseConnectionConfiguration
    schemaName: public
    # -- (string) Имя пользователя БД
    # @section -- databaseConnectionConfiguration
    username: collector
    # -- (string) Пароль пользователя БД
    # @section -- databaseConnectionConfiguration
    password: 123QWEasd
    customSecret:
      # -- (string) Имя существующего секрета
      # @section -- databaseConnectionConfiguration
      secretName: ""
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
    bankVaultsInjector:
      # -- (bool) Включение использования [Bank-Vaults Secret injection webhook](https://bank-vaults.dev/docs/mutating-webhook/)
      # @section -- databaseConnectionConfiguration
      enabled: false
      # -- (string) Ключ содержащий имя учётной записи
      # @section -- databaseConnectionConfiguration
      userKey: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
    tls:
      # -- (bool) Включает использование TLS для подключения к БД
      # @section -- databaseConnectionConfiguration
      enabled: false
      ca:
        # -- (string) СА цепочка в Base64 формате
        # @section -- databaseConnectionConfiguration
        crtBase64: ""
        # -- (string) Имя существующего секрета
        # @section -- databaseConnectionConfiguration
        secretName: ""
        # -- (string) Ключ содержащий сертификат
        # @section -- databaseConnectionConfiguration
        secretKey: ""
  redis:
    # -- (string) Адрес сервера
    # @default -- "ReleaseName-redis.ReleaseNamespace"
    # @section -- databaseConnectionConfiguration
    host: ""
    # -- (string) Порт
    # @default -- 6379
    # @section -- databaseConnectionConfiguration
    port: ""
    # -- (string) Пароль пользователя БД
    # @section -- databaseConnectionConfiguration
    password: ""
    customSecret:
      # -- (string) Имя существующего секрета
      # @section -- databaseConnectionConfiguration
      secretName: ""
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""
    bankVaultsInjector:
      # -- (bool) Включение использования [Bank-Vaults Secret injection webhook](https://bank-vaults.dev/docs/mutating-webhook/)
      # @section -- databaseConnectionConfiguration
      enabled: false
      # -- (string) Ключ содержащий пароль учётной записи
      # @section -- databaseConnectionConfiguration
      passwordKey: ""

policy:
  # -- (bool) Включение автоматического обучения
  # @section -- Параметры обучения
  autoTraining: false
  # -- (bool) Старт обучения только если видели старт контейнера в поде, работает только при включенном автообучении
  # @section -- Параметры обучения
  onlyFullLifecycle: false
  # -- (int) Размер окна обучения в секундах
  # @section -- Параметры обучения
  trainingTime: 120
  # -- (int) Интервал архивирования неактивных политик в секундах
  # @section -- Параметры обучения
  archiveTime: 86400
  anomaliesEnabled:
    # -- (bool) Отключает обработку файловых событий
    # @section -- Параметры обучения
    file: true
    # -- (bool) Отключает обработку сетевых событий
    # @section -- Параметры обучения
    network: true
    # -- (bool) Отключает обработку процессных событий
    # @section -- Параметры обучения
    process: true
  # @schema
  # examples: ["kube-*,test-*"]
  # @schema
  # -- (string) Список неймспейсов, разделенных запятыми, в которых отключено автообучение, работает только при включенном автообучении
  # @section -- Параметры обучения
  excludedNamespaces: ""

proxy:
  # -- (string) Адрес прокси сервера для HTTP запросов
  # @section -- Прокси сервер
  httpProxy: ""
  # -- (string) Адрес прокси сервера для HTTPS запросов
  # @section -- Прокси сервер
  httpsProxy: ""
  # @schema
  # examples: ["10.96.0.1"]
  # @schema
  # -- (string) Лист имен и адресов, разделенных запятыми,которые не должны проксироваться. Допускаются *
  # По умолчанию содержит: .cluster.local,.local,.%Release.Namespace%,%gatewayEndpoint%
  # Данная переменная всегда должна включать адрес сервиса kubernetes.default в формате IP адреса
  # @section -- Прокси сервер
  noProxy: ""

globalIngress:
  ingressClassName: ""
  tlsSecretName: ""
  annotations: {}
  labels: {}

admin:
  # -- (string) Имя пользователя для входа в веб-интерфейс
  # @section -- Веб-интерфейс
  user: luntry
  # -- (string) Пароль пользователя для входа в веб-интерфейс
  # @section -- Веб-интерфейс
  password: luntry_pass
  # -- (int) Время жизни сессии в часах
  # @section -- Веб-интерфейс
  idleLogoutTimeout: 1

multicluster:
  # -- (bool) Включение multicluster установки
  # @section -- multicluster setup
  enabled: false
  # @schema
  # enum:
  # - main
  # - secondary
  # @schema
  # -- Выбор multicluster роли
  # @section -- multicluster setup
  role: main
  # -- (string) Имя кластера (имена всех кластеров должны быть уникальны)
  # @section -- multicluster setup
  clusterName: main
  # -- (string) Описание кластера
  # @section -- multicluster setup
  clusterDescription: ""
  exporter:
    # -- (string) Адрес или доменное имя exporter в мастер-кластере
    # @section -- multicluster setup
    host: ""
    # -- (string) Порт exporter в мастер-кластере
    # @section -- multicluster setup
    port: ""
  gateway:
    # -- (string) Адрес или доменное имя gateway в мастер-кластере
    # @section -- multicluster setup
    host: ""
    # -- (string) Порт gateway в мастер-кластере
    # @section -- multicluster setup
    port: ""
  cmdDispatcher:
    # -- (string) Адрес или доменное имя cmdDispatcher в мастер-кластере
    # @section -- multicluster setup
    host: ""
    # -- (string) Порт cmdDispatcher в мастер-кластере
    # @section -- multicluster setup
    port: ""

caBundle:
  # -- (string) СА цепочка в Base64 формате
  # @section -- caBundle
  crtBase64: ""
  # -- (string) Имя существующего секрета, содержащего цепочку сертификатов
  # @section -- caBundle
  secretName: ""

log:
  # -- (string) Имя среды, будет добавлено в поле env json лога
  # @section -- Logging
  env: "PROD"
  # @schema
  # enum:
  # - json
  # - text
  # @schema
  # -- Формат лога
  # @section -- Logging
  format: "json"
  # -- (string) Константные поля в json логе
  # @section -- Logging
  constFields: "env:@LOG_ENV,system:luntry,inst:@NODE_NAME,pod_name:@POD_NAME"
  # -- (string) Позволяет изменить имена стандартных полей. Пример "time:@timestamp,msg:message,level:LEVEL,func:method,file:source"
  # @section -- Logging
  fieldMap: ""

auditLogAnalyzer:
  # -- (bool) Включает деплой сервиса
  # @section -- Audit log analyzer
  enabled: true
  # @schema
  # enum:
  # - db
  # - gateway
  # @schema
  # -- Выбор драйвера для подключения к БД
  # @section -- Audit log analyzer
  driver: gateway
  log:
    # @schema
    # enum:
    # - trace
    # - debug
    # - info
    # - warn
    # - err
    # @schema
    # -- Уровень логирования
    # @section -- Audit log analyzer
    logLevel: info
  prometheus:
    # -- (bool) Включает отображение prometheus метрик для сервиса
    # @section -- Audit log analyzer
    enabled: false
  profiling:
    # -- (bool) Включает профилирование сервиса
    # @section -- Audit log analyzer
    enabled: false
  tls:
    # -- (bool) Включает использование TLS для webhook
    # @section -- Audit log analyzer
    enabled: false
    crt:
      # -- (string) Сертификат в Base64
      # @section -- Audit log analyzer
      crtBase64: ""
      # -- (string) Ключ в Base64
      # @section -- Audit log analyzer
      keyBase64: ""
      # -- (string) Существующий секрет типа kubernetes.io/tls, содержащий сертификат и ключ
      # @section -- Audit log analyzer
      secretName: ""

  # -- (int) Количество реплик
  # @section -- Audit log analyzer
  replicas: 2
  image:
    # -- (string) Тэг образа
    # @section -- Audit log analyzer
    tag: ""
    # -- (string) Имя образа
    # @section -- Audit log analyzer
    name: audit-log-analyzer
    # @schema
    # enum:
    # - IfNotPresent
    # - Always
    # - Never
    # @schema
    # -- imagePullPolicy
    # @section -- Audit log analyzer
    pullPolicy: IfNotPresent
  # @schema
  # additionalProperties: true
  # @schema
  # -- (object) Позволяет добавлять аннотации к подам
  # @section -- Audit log analyzer
  annotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- (object) Позволяет добавлять аннотации к сервисам
  # @section -- Audit log analyzer
  serviceAnnotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- (object) Управляет назначением подов на ноды через механизм nodeSelector
  # @section -- Audit log analyzer
  nodeSelector: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- (list) Управляет назначением подов на ноды через механизм tolerations
  # @section -- Audit log analyzer
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- (object) Управляет назначением подов на ноды через механизм affinity / anti-affinity
  # @section -- Audit log analyzer
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: "{{ .Release.Name }}-audit-log-analyzer"
            topologyKey: kubernetes.io/hostname
  updateStrategy:
    # @schema
    # enum:
    # - Recreate
    # - RollingUpdate
    # @schema
    # -- Стратегия обновления подов
    # @section -- Audit log analyzer
    type: RollingUpdate
    # @schema
    # type: [object, null]
    # properties:
    #   maxUnavailable:
    #     type: [string, integer]
    #     description: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#max-unavailable
    #   maxSurge:
    #     type: [string, integer]
    #     description: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#max-surge
    # @schema
    # -- Параметры Rolling Update
    # @section -- Audit log analyzer
    rollingUpdate: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- (list) Позволяет добавлять переменные окружения для компонентов
  # @section -- Audit log analyzer
  additionalEnvs: []
  # @schema
  # examples: ["none", "nano", "micro", "small", "medium", "large", "xlarge", "2xlarge"]
  # @schema
  # -- (string) Пресет ресурсов
  # @section -- Audit log analyzer
  resourcesPreset: none
  # -- (object) Запросы / лимиты ресурсов
  # @section -- Audit log analyzer
  resources:
    requests:
      cpu: 150m
      memory: 75Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    # @schema
    # enum:
    # - ClusterIP
    # - NodePort
    # - LoadBalancer
    # @schema
    # -- Тип kubernetes сервиса
    # @section -- Audit log analyzer
    type: LoadBalancer
    # @schema
    # type: ["null", "integer", "string"]
    # @schema
    # -- IP-адрес
    # @section -- Audit log analyzer
    clusterIP: ""
    # @schema
    # type: ["null", "integer", "string"]
    # @schema
    # --  Порт на ноде кластера k8s, на который будет смаплен порт сервиса Audit log analyzer. Используется только в случае если service.type=NodePort
    # @section -- Audit log analyzer
    nodePort: ""
  ingress:
    # -- (bool) Включает использование ingress
    # @section -- Audit log analyzer
    enabled: false
    # @schema
    # additionalProperties: true
    # @schema
    # -- (object) Позволяет добавлять аннотации к ingress
    # @section -- Audit log analyzer
    annotations:
      {}
      # nginx.ingress.kubernetes.io/rewrite-target: /
    # @schema
    # additionalProperties: true
    # @schema
    # -- (object) Позволяет добавлять метки к ingress
    # @section -- Audit log analyzer
    labels: {}
    # -- (string) Доменное имя
    # @section -- Audit log analyzer
    domainName: audit-log-analyzer.luntry
    # -- (string) ingress класс
    # @section -- Audit log analyzer
    ingressClassName: ""
    tls:
      # -- (bool) Включает использование TLS
      # @section -- Audit log analyzer
      enabled: false
      # -- (string) Имя секрета в namespace Luntry, содержащего TLS-сертификат и ключ
      # @section -- Audit log analyzer
      secretName: ""
  # -- (object) Container securityContext
  # @section -- Audit log analyzer
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: ["ALL"]
  serviceAccount:
    # -- (bool) Включает создание сервис аккаунта
    # @section -- Audit log analyzer
    create: false
    # -- (string) Имя существующего сервис аккаунта
    # @default -- ReleaseName-servicename
    # @section -- Audit log analyzer
    name: ""

postgres:
  # -- (bool) Включает деплой PostgreSQL вместе с Luntry. Только для тестирования в небольших кластерах!
  # @section -- Postgres
  enabled: false
  # @schema
  # enum:
  # - deployment
  # - statefulset
  # @schema
  # -- Тип развёртывания
  # @section -- Postgres
  mode: deployment
  image:
    # -- (string) Путь к registry с образом
    # @section -- Postgres
    registry: ""
    # -- (string) Имя проекта и образа
    # @section -- Postgres
    name: luntry/3dparty/postgres
    # -- (string) Тэг образа
    # @section -- Postgres
    tag: 18-trixie
  pvc:
    # @schema
    # enum:
    # - emptydir
    # - genericEphemeralVolume
    # - pvc
    # @schema
    # -- Тип хранилища
    # @section -- Postgres
    type: pvc
