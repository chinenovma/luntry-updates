sensor:
  # -- (bool) Включает деплой сервиса
  # @section -- Sensor
  enabled: true
  btf:
    # -- (bool) Включает использование BTF информации для компиляции eBPF пробы. Используется в случае, если на нодах отсутствуют хедеры ядра
    # @section -- Sensor
    enabled: false
    # -- (bool) Включает использование BTF maps для компиляции eBPF пробы.
    # @section -- Sensor
    useBtfMaps: true
    # -- (bool) Отключает использование kallsyms_all
    # @section -- Если ядро собрано с KALLSYMS_ALL=n то необходимо отключить использование их у сенсора. Для проверки можно использовать команду на ноде `cat /boot/config-$(uname -r) | grep CONFIG_KALLSYMS_ALL`.
    disableKallsymsAll: false
  modulesDisabled:
    # -- (int) Отключает сбор файловых событий
    # @section -- Sensor
    files: 0
    # -- (int) Отключает сбор сетевых событий
    # @section -- Sensor
    network: 0
  unstableMonotonic:
    # -- (bool) В виртуализированных средах может возникать ошибка связанная с kernel monotonic clock
    # @section -- Sensor
    enabled: false
  balancing:
    # -- (int) Задает время ожидания перед следующим реконнектом сенсора к коллектору при ребалансировке
    # @section -- Sensor
    reconnectTimeout: 1800
    # -- (int) Задает минимальную разницу нагрузки коллекторов при которой произойдет ребалансировка
    # @section -- Sensor
    reconnectPercDelta: 20
  dropOverflowEvents:
    # -- (bool) Включает отбрасывание избыточных событий, которые могут вызвать переполнение локальной RPC очереди, может приводить к потере событий
    # @section -- Sensor
    enabled: false
  dropEventsBeforeConvergence:
    # -- (bool) Включает отбрасывание избыточных событий, на этапе запуска и построения дерева процессов. Позволяет снизить нагрузку на систему во время старта сенсора
    # @section -- Sensor
    enabled: true
  sendNonContainerEvents:
    # -- (bool) Включает более агрессивный дроп событий не относящихся к контейнерным. Может приводить к потере контейнерных событий, имеет смысл использовать только в некоторых средах
    # @section -- Sensor
    enabled: false
  # -- (int) Размер локальной очереди событий, рекомендуется увеличить значение в случае наблюдения проблем связанных с переполнением локальной очереди
  # @section -- Sensor
  rpcQueueCapacity: 600000
  # -- (int) Ограничивает размер аргументов процессов, передаваемых на бэкенд
  # @section -- Sensor
  argsLengthLimit: 1000
  log:
    # -- (string) Уровень логирования. Установите "sensor=trace,procfs_scraper=trace,rpc=trace" для отладки.
    # @section -- Sensor
    logLevel: sensor=info
    # -- (bool) Verbose режим загрузки eBPF-пробы
    # @section -- Sensor
    bpfDebug: false
    # -- (bool) Расширенный вывод в stdout
    # @section -- Sensor
    verbose: false
    # -- (bool) Запуск инит контейнера для очистки старых дебаг логов, имеет смысл включать только в случае если logLevel=trace
    # @section -- Sensor
    cleanup: false
  prometheus:
    # -- (bool) Включает отображение prometheus метрик для сервиса
    # @section -- Sensor
    enabled: false
    # -- (string) Настройка порта контейнера, на котором будут отображаться метрики
    # @section -- Sensor
    address: "0.0.0.0:8080"
  readinessCheck:
    # -- (bool) Включает readiness endpoint для подов сенсора. Сенсор переходит в Ready после окончания процедуры схождения
    # @section -- Sensor
    enabled: true
  # -- (string) Задает директорию внутри сенсора для сохранения дебаг логов. Используется только в случае, если уровень логирования выставлен в trace
  # @section -- Sensor
  dataDir: "/var/log/sensor/"
  # -- (string) Задает корневую директорию внутри контейнера для маунта директорий хоста
