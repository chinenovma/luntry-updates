{{- if and (.Values.exporter.enabled) (.Values.exporter.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "exporter") .Values.exporter.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-exporter
    {{- include "common.labels" . | nindent 4 }}
{{- end }}