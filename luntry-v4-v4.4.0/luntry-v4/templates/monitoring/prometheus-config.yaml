{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval:     30s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
      evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
    scrape_configs:
      - job_name: 'prometheus'
        # metrics_path defaults to '/metrics'
        # scheme defaults to 'http'.
        static_configs:
        - targets: ['localhost:9090']

      - job_name: 'luntry-pods'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - {{ .Release.Namespace }}
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
        - target_label: cluster
          replacement: "{{ .Values.multicluster.clusterName }}"

  {{- if .Values.monitoring.prometheus.federation }}
  {{- range $f := .Values.monitoring.prometheus.federation }}
      - job_name: 'federate {{ $f.name }}'
        honor_labels: true
        metrics_path: '/federate'
        params:
          'match[]':
            - '{job="luntry-pods"}'
            - '{__name__=~"job:.*"}'
        static_configs:
          - targets:
            - '{{ $f.endpoint }}'
            labels:
              cluster: '{{ $f.name }}'
  {{- end }}
  {{- end }}
  
{{- end -}}