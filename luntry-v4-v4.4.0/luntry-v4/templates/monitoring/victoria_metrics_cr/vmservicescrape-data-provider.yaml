{{- if and .Values.dataProvider.enabled .Values.monitoring.enabled .Values.monitoring.victoriaMetricsScrapeCR.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: data-provider
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
    - interval: 60s
      path: internals/metrics
      scrapeTimeout: 30s
      targetPort: 80
  jobLabel: "app.kubernetes.io/component"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-data-provider
{{- end }}