{{- if and .Values.sensor.enabled ( or .Values.monitoring.enabled .Values.sensor.prometheus.enabled ) .Values.monitoring.victoriaMetricsScrapeCR.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: "sensor-rs"
  namespace: {{ .Release.Namespace }}
spec:
  podMetricsEndpoints:
    - port: metrics
      scheme: http
  jobLabel: "app.kubernetes.io/component"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-sensor-rs
{{- end }}