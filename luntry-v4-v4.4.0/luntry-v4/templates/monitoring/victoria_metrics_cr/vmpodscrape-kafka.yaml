{{- if and .Values.kafka.enabled ( or .Values.monitoring.enabled .Values.kafka.metricExporter.enabled ) .Values.monitoring.victoriaMetricsScrapeCR.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: "kafka"
  namespace: {{ .Release.Namespace }}
spec:
  podMetricsEndpoints:
    - port: metrics
      scheme: http
  jobLabel: "app.kubernetes.io/component"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-kafka
{{- end }}