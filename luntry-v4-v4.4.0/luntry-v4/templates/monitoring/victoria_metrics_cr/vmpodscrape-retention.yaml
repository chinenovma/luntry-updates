{{- if and .Values.retention.enabled ( or .Values.monitoring.enabled .Values.retention.prometheus.enabled ) .Values.monitoring.victoriaMetricsScrapeCR.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: "retention"
  namespace: {{ .Release.Namespace }}
spec:
  podMetricsEndpoints:
    - port: probe-port
      scheme: http
  jobLabel: "app.kubernetes.io/component"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-retention
{{- end }}