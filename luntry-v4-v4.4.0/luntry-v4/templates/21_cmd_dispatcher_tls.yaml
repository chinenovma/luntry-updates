{{- if and .Values.cmdDispatcher.tls.enabled .Values.cmdDispatcher.tls.ca.crtBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cmd-dispatcher-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-dispatcher
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.cmdDispatcher.tls.ca.crtBase64 }}
{{- end }}

{{- if .Values.cmdDispatcher.enabled }}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) }}
{{- if (and .Values.cmdDispatcher.tls.enabled .Values.cmdDispatcher.tls.crt.crtBase64 .Values.cmdDispatcher.tls.crt.keyBase64) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cmd-dispatcher-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-cmd-dispatcher
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  tls.crt: {{ .Values.cmdDispatcher.tls.crt.crtBase64 }}
  tls.key: {{ .Values.cmdDispatcher.tls.crt.keyBase64 }}
type: kubernetes.io/tls
{{- end }}
{{- end }}
{{- end }}