{{- if and (.Values.vulndb.enabled) (.Values.vulndb.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "vulndb") .Values.vulndb.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-vulndb
    {{- include "common.labels" . | nindent 4 }}
{{- end }}