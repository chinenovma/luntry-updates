{{- if and .Values.databaseConnectionConfiguration.postgres.tls.enabled .Values.databaseConnectionConfiguration.postgres.tls.ca.crtBase64 -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pg-tls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-postgres
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.databaseConnectionConfiguration.postgres.tls.ca.crtBase64 }}
{{- end }}