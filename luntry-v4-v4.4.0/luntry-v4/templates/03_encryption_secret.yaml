---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-encryption-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "encryption-secret"
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_STRING: {{ .Values.develop.encryption_string | quote }}
