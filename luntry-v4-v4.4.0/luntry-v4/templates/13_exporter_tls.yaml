{{- if and .Values.exporter.tls.enabled .Values.exporter.tls.ca.crtBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-exporter-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-exporter
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.exporter.tls.ca.crtBase64 }}
{{- end }}

{{- if and .Values.exporter.enabled .Values.exporter.tls.crt.crtBase64 .Values.exporter.tls.crt.keyBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-exporter-crt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-exporter
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  tls.crt: {{ .Values.exporter.tls.crt.crtBase64 }}
  tls.key: {{ .Values.exporter.tls.crt.keyBase64 }}
type: kubernetes.io/tls
{{- end }}

{{- if and .Values.exporter.enabled .Values.exporter.export.mtls.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-exporter-mtls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-exporter
    {{- include "common.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.exporter.export.mtls.ca }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-exporter-mtls-crt-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-exporter
    {{- include "common.labels" . | nindent 4 }}
data:
#Cert and key have to be base64 encoded
  tls.crt: {{ .Values.exporter.export.mtls.certificate }}
  tls.key: {{ .Values.exporter.export.mtls.key }}
type: kubernetes.io/tls
{{- end }}