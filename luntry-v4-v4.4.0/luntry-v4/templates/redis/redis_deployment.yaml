{{- $app := .Values.redis -}}
{{- $db := .Values.databaseConnectionConfiguration }}
{{- if $app.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-redis
    {{- include "common.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Release.Name }}-redis
        {{- include "common.labels" . | nindent 8 }}
      {{- if or (and .Values.monitoring.enabled $app.metricExporter.enabled) $app.annotations $db.redis.bankVaultsInjector.enabled }}
      annotations:
        {{- if and .Values.monitoring.enabled $app.metricExporter.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: metrics
        {{- end }}
        {{- if $db.redis.bankVaultsInjector.enabled }}
        {{- toYaml $db.bankVaultsInjectorAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.monitoring.grafana.annotations }}
        {{- toYaml .Values.monitoring.grafana.annotations | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with $app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "renderSecurityContext" (dict "secContext" $app.podSecurityContext "context" $) | nindent 8 }}
      {{- if or $app.serviceAccount.create $app.serviceAccount.name }}
      serviceAccountName: {{ quote (default (printf "%s-%s" .Release.Name "redis") $app.serviceAccount.name) }}
      {{- end }}
      containers:
      - name: redis
        image: "{{ $app.image.registry | default .Values.imageCredentials.registry }}/{{ $app.image.name }}:{{ $app.image.tag }}"
        imagePullPolicy: {{ $app.image.pullPolicy | quote }}
        {{- if eq $app.resourcesPreset "none" }}
        resources:
          {{- toYaml $app.resources | nindent 10 }}
        {{- else }}
        resources: {{- include "common.resources.preset" (dict "type" $app.resourcesPreset) | nindent 10 }}
        {{- end }}
        securityContext:
          {{- include "renderSecurityContext" (dict "secContext" $app.securityContext "context" $) | nindent 10 }}
        command:
        {{- if $db.redis.bankVaultsInjector.enabled }}
          - sh
          - -c
          - cp /etc/redis/redis.conf /tmp/redis.conf && echo "" >> /tmp/redis.conf && echo "requirepass ${REDIS_PASSWORD}" >> /tmp/redis.conf && /usr/local/bin/redis-server /tmp/redis.conf
        {{- else if or $db.redis.password $db.redis.customSecret.secretName }}
          - /usr/local/bin/redis-server
          - /etc/redis/redis.conf
          - --requirepass
          - "$(REDIS_PASSWORD)"
        {{- else }}
          - /usr/local/bin/redis-server
          - /etc/redis/redis.conf
        {{- end }}
        env:
          - name: REDIS_PORT
            value: "6379"
          {{- include "redis.pass" . | nindent 10 }}
          {{- range $app.additionalEnvs }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
        ports:
          - name: redis
            containerPort: 6379
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 6
          successThreshold: 1
          failureThreshold: 5
          exec:
            command:
              - redis-cli
              - ping
        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 5
          tcpSocket:
            port: redis
        volumeMounts:
          - name: redis-data
            mountPath: /data
          - name: config
            mountPath: /etc/redis
      {{- if $app.metricExporter.enabled }}
      - name: redis-exporter
        image: "{{ $app.metricExporter.image.registry }}/{{ $app.metricExporter.image.name }}:{{ $app.metricExporter.image.tag }}"
        imagePullPolicy: {{ $app.metricExporter.image.pullPolicy | quote }}
        securityContext:
          {{- toYaml $app.metricExporter.securityContext | nindent 12 }}
        {{- if eq $app.metricExporter.resourcesPreset "none" }}
        resources:
          {{- toYaml $app.metricExporter.resources | nindent 10 }}
        {{- else }}
        resources: {{- include "common.resources.preset" (dict "type" $app.metricExporter.resourcesPreset) | nindent 10 }}
        {{- end }}
        ports:
          - name: metrics
            containerPort: 8080
        env:
          {{- include "redis.pass" . | nindent 10 }}
          - name: REDIS_EXPORTER_WEB_LISTEN_ADDRESS
            value: "0.0.0.0:8080"
          - name: REDIS_ADDR
            value: "redis://localhost:6379"
      {{- end }}
      volumes:
        - name: redis-data
          {{- if eq ($app.pvc.type | lower) "emptydir" }}
          emptyDir:
            sizeLimit: {{ $app.pvc.size | quote }}
          {{- else if eq ($app.pvc.type | lower) "genericephemeralvolume" }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - {{ $app.pvc.accessMode }}
                storageClassName: {{ $app.pvc.storageClass }}
                resources:
                  requests:
                    storage: {{ $app.pvc.size | quote }}
          {{- else if eq ($app.pvc.type | lower) "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redis
          {{- else }}
          {{- fail "incorrect volume type in redis.pvc.type" }}
          {{- end }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-redis-configuration
      {{- include "imagePullSecrets" . | nindent 6 }}
{{- end }}
