{{- if .Values.caBundle.crtBase64 -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ca-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-ca-bundle
    {{- include "common.labels" . | nindent 4 }}
data:
  luntry-bundle.crt: {{ .Values.caBundle.crtBase64 }}
{{- end }}