{{- if and .Values.imageScanner.enabled .Values.imageScanner.encryptionString -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cluster-scanner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-cluster-scanner
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_STRING: {{ .Values.imageScanner.encryptionString | quote }}
{{- end }}