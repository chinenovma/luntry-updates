{{- if .Values.networker.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-networker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-networker
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.networker.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.networker.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Release.Name }}-networker
  ports:
    - name: api
      protocol: TCP
      port: 12345
{{- if .Values.networker.profiling.enabled }}
    - name: prof
      protocol: TCP
      targetPort: 6060
      port: 6060
{{- end }}
{{- end }}