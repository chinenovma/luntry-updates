{{- if and (.Values.retention.enabled) (.Values.retention.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "retention") .Values.retention.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-retention
    {{- include "common.labels" . | nindent 4 }}
{{- end }}