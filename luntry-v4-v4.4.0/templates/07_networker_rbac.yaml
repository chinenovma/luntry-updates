{{- if and (.Values.networker.enabled) (.Values.networker.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "networker") .Values.networker.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-networker
    {{- include "common.labels" . | nindent 4 }}
{{- end }}