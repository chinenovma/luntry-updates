{{- if and .Values.watcher.enabled ( or .Values.monitoring.enabled .Values.watcher.prometheus.enabled ) .Values.monitoring.victoriaMetricsScrapeCR.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: "watcher"
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      scrapeTimeout: 30s
      targetPort: 8080
  jobLabel: "app.kubernetes.io/component"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Release.Name }}-watcher
{{- end }}