{{- if and (.Values.supervisor.enabled) (.Values.supervisor.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "supervisor") .Values.supervisor.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-supervisor
    {{- include "common.labels" . | nindent 4 }}
{{- end }}