{{- if and (.Values.visualizer.enabled) (.Values.visualizer.serviceAccount.create) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ quote (default (printf "%s-%s" .Release.Name "visualizer") .Values.visualizer.serviceAccount.name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-visualizer
    {{- include "common.labels" . | nindent 4 }}
{{- end }}