{{- if .Values.checker.enabled -}}
{{- if or (not .Values.multicluster.enabled) (and (.Values.multicluster.enabled) (eq .Values.multicluster.role "main")) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-checker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ .Release.Name }}-checker
    {{- include "common.labels" . | nindent 4 }}
  {{- if .Values.checker.serviceAnnotations }}
  annotations:
    {{- toYaml .Values.checker.serviceAnnotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Release.Name }}-checker
  ports:
    - name: probe-port
      protocol: TCP
      port: 8080
    - name: grpc-port
      protocol: TCP
      port: 20172
{{- end }}
{{- end }}